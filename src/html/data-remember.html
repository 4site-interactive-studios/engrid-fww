<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food &amp; Water Watch</title>
</head>

<body>
  <script>
    (function () {
      //allowed domains
      var whitelist = [
        "act.foodandwaterwatch.org",
        "act.foodandwateraction.org",
        "give.foodandwaterwatch.org",
        "give.foodandwateraction.org"
      ];
      // The encryption key is derived deterministically from a simple device
      // fingerprint so that it produces the same result across Chrome's
      // storage partitions (different top-level sites embedding this iframe
      // get separate localStorage, but the fingerprint is identical).
      var localStorageKeyName = "engrid-remember-me-key";

      function verifyOrigin(origin) {
        var domain = origin.replace(/^https?:\/\/|:\d{1,4}$/g, "").toLowerCase(),
          i = 0,
          len = whitelist.length;
        while (i < len) {
          if (whitelist[i] == domain) {
            return true;
          }
          i++;
        }
        return false;
      }

      function arrayBufferToBase64(buffer) {
        var binary = "";
        var bytes = new Uint8Array(buffer);
        for (var i = 0; i < bytes.byteLength; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return window.btoa(binary);
      }

      function base64ToArrayBuffer(base64) {
        var binary = window.atob(base64);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes.buffer;
      }

      function getDeviceFingerprint() {
        var parts = [
          screen.width + "x" + screen.height,
          navigator.language || "",
          navigator.hardwareConcurrency ? navigator.hardwareConcurrency.toString() : "",
          (navigator.deviceMemory || "").toString(),
          Intl.DateTimeFormat().resolvedOptions().timeZone || ""
        ];
        return parts.join("|");
      }

      async function getEncryptionKey() {
        if (!window.crypto || !window.crypto.subtle) {
          return null;
        }

        // Try cached key first
        var storedKey = localStorage.getItem(localStorageKeyName);
        if (storedKey) {
          try {
            return await window.crypto.subtle.importKey(
              "raw",
              base64ToArrayBuffer(storedKey),
              { name: "AES-GCM", length: 256 },
              false,
              ["encrypt", "decrypt"]
            );
          } catch (e) {
            // Corrupted, regenerate
          }
        }

        // Derive key from device fingerprint (deterministic)
        try {
          var fp = new TextEncoder().encode(getDeviceFingerprint());
          var keyMaterial = await window.crypto.subtle.digest("SHA-256", fp);
          var key = await window.crypto.subtle.importKey(
            "raw",
            keyMaterial,
            { name: "AES-GCM", length: 256 },
            true,
            ["encrypt", "decrypt"]
          );
          var exported = await window.crypto.subtle.exportKey("raw", key);
          localStorage.setItem(localStorageKeyName, arrayBufferToBase64(exported));
          return key;
        } catch (e) {
          return null;
        }
      }

      async function encryptPayload(plaintext) {
        var key = await getEncryptionKey();
        if (!key) {
          return null;
        }
        var iv = window.crypto.getRandomValues(new Uint8Array(12));
        var ciphertext = await window.crypto.subtle.encrypt(
          { name: "AES-GCM", iv: iv },
          key,
          new TextEncoder().encode(plaintext)
        );
        var combined = new Uint8Array(iv.length + ciphertext.byteLength);
        combined.set(iv);
        combined.set(new Uint8Array(ciphertext), iv.length);
        return arrayBufferToBase64(combined);
      }

      async function decryptPayload(encryptedBase64) {
        var key = await getEncryptionKey();
        if (!key) {
          return null;
        }
        var combined = new Uint8Array(base64ToArrayBuffer(encryptedBase64));
        if (combined.length < 13) {
          return null;
        }
        var iv = combined.slice(0, 12);
        var ciphertext = combined.slice(12);
        try {
          var decrypted = await window.crypto.subtle.decrypt(
            { name: "AES-GCM", iv: iv },
            key,
            ciphertext
          );
          return new TextDecoder().decode(decrypted);
        } catch (e) {
          // Foreign device or cleared storage: fail gracefully instead of
          // throwing, so the caller can fall back to the normal,
          // no-autofill experience.
          return null;
        }
      }

      function readCookie(name) {
        var nameEQ = encodeURIComponent(name) + "=";
        var ca = document.cookie.split(';');
        for (var i = 0; i < ca.length; i++) {
          var c = ca[i];
          while (c.charAt(0) === ' ')
            c = c.substring(1, c.length);
          if (c.indexOf(nameEQ) === 0)
            return decodeURIComponent(c.substring(nameEQ.length, c.length));
        }
        return null;
      }

      function writeCookie(name, value, days) {
        var d = new Date();
        d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
        document.cookie = name + "=" + encodeURIComponent(value) + ";expires=" + d.toUTCString() + ';SameSite=none;Secure;';
      }

      async function handleRequest(event) {
        if (!verifyOrigin(event.origin)) {
          return;
        }
        var data = JSON.parse(event.data);
        if (data.hasOwnProperty('operation') && data.hasOwnProperty('key')) {
          var retVal = {
            id: data.id,
            key: data.key,
            value: null
          };
          if (data.operation == 'write' && data.hasOwnProperty('value')) {
            if (data.encryptData) {
              var payload = JSON.stringify(data.value);
              var encrypted = await encryptPayload(payload);
              if (encrypted) {
                writeCookie(data.key, encrypted, data.expires || 60);
              }
            } else {
              writeCookie(data.key, JSON.stringify(data.value), data.expires || 60);
            }
          } else if (data.operation == 'read') {
            var raw = readCookie(data.key);
            if (raw) {
              if (data.encryptData) {
                retVal.value = await decryptPayload(raw);
              } else {
                retVal.value = raw;
              }
            }
          }
          event.source.postMessage(JSON.stringify(retVal), event.origin);
        }
      }

      if (window.addEventListener) {
        window.addEventListener("message", handleRequest, false);
      } else if (window.attachEvent) {
        window.attachEvent("onmessage", handleRequest);
      }
    })();
  </script>
</body>

</html>
